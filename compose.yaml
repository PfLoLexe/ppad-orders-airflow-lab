name: orders-lab
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
      BI_PASSWORD: ${BI_PASSWORD}
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./sql:/lab-sql:ro
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=80, -c, work_mem=4MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d warehouse']
      interval: 10s
      timeout: 5s
      retries: 12
  airflow:
    image: apache/airflow:3.3.2-python3.12
    user: "${AIRFLOW_UID:-50000}:0"
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API__WORKERS: '1'
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: '1'
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__LOGGING__LOGGING_LEVEL: WARNING
      WAREHOUSE_DSN: postgresql://warehouse:${WAREHOUSE_PASSWORD}@postgres:5432/warehouse
      DATASET_MANIFEST: /opt/lab/${DATASET_MANIFEST}
      PYTHONPATH: /opt/lab
    command: [bash, -ec, "cp /opt/airflow/auth/passwords.json /opt/airflow/passwords.json; exec airflow standalone"]
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./orders_lab:/opt/lab/orders_lab:ro
      - ./scripts:/opt/lab/scripts:ro
      - ./reports:/opt/lab/reports
      - ./sql:/opt/lab/sql:ro
      - ./data:/opt/lab/data:ro
      - ./private:/opt/airflow/auth:ro
      - airflowlogs:/opt/airflow/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health',timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
  metabase:
    image: metabase/metabase:v0.64.1
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: postgres
      MB_DB_PORT: '5432'
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: '-Xmx768m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m'
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_SESSION_SECRET_KEY: ${METABASE_SESSION_SECRET}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET}
      MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE: 'false'
    ports: ['127.0.0.1:3333:3000']
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
volumes:
  pgdata:
  airflowlogs:
